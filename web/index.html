<!doctype html>
<html lang="en">
<head>
<meta name="color-scheme" content="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FluidSync</title>
<link rel="icon" href="data:,"><!-- no favicon request: the machine serves one request at a time -->
<style>
/* Laid out for a 360px-wide phone with an old Chromium (Honor 7C, Android 8): CSS grid with grid-gap, no flex gap (Chrome 84+) */
:root{--bg:#f3f4f6;--panel:#fff;--line:#d1d5db;--text:#111827;--muted:#6b7280;--accent:#2563eb;--bad:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 Roboto,"Segoe UI",sans-serif}
header{position:-webkit-sticky;position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px}
#queue{font-size:14px;padding:4px 10px;border-radius:12px;background:var(--bg)}
h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 8px}
main{max-width:640px;margin:0 auto;padding:0 12px 96px}
.muted{color:var(--muted);font-size:14px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;gap:10px}
.preset{display:grid;grid-template-columns:40px 1fr;grid-gap:2px 10px;align-items:center;min-height:72px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font:inherit;text-align:left}
.preset:active{border-color:var(--accent);background:#eff6ff}
.preset:disabled{opacity:.5}
.preset .sw{grid-row:1/3}
.preset b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset small{color:var(--muted);font-size:13px}
.preset .parts{grid-column:1/3;font-size:12px;color:var(--muted);margin-top:4px}
.sw{width:40px;height:40px;border-radius:50%;border:1px solid var(--line)}
details{margin-top:24px;border-top:1px solid var(--line)}
summary{padding:16px 0;font-weight:600;font-size:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.liq{display:grid;grid-template-columns:58px 1fr 48px auto;grid-gap:8px;align-items:center}
.liq b{font-size:14px}
.top{display:grid;grid-template-columns:1fr 84px;grid-gap:8px}
.pcts{display:grid;grid-template-columns:1fr 1fr 1fr;grid-gap:8px;margin:10px 0}
.foot{display:grid;grid-template-columns:1fr auto auto;grid-gap:8px;align-items:center}
input,button{font:inherit;font-size:16px;min-height:44px;border-radius:8px}
input{width:100%;color:var(--text);background:#fff;border:1px solid var(--line);padding:8px 10px}
input:focus{outline:0;border-color:var(--accent)}
input[type=color]{padding:3px;height:44px}
label{display:block;font-size:12px;color:var(--muted)}
label span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
button.act{padding:0 16px;border:0;background:var(--accent);color:#fff}
button.del{background:var(--bg);color:var(--bad);border:1px solid var(--line)}
button:disabled{opacity:.5}
.sum{font-size:15px;font-weight:600}
.sum.bad{color:var(--bad)}
#msg{position:fixed;left:12px;right:12px;bottom:12px;z-index:3;max-width:616px;margin:0 auto;padding:14px 16px;border-radius:10px;background:var(--text);color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#msg.show{opacity:1}
#msg.err{background:var(--bad)}
</style>
</head>
<body>
<header><h1>FluidSync</h1><span id="queue" class="muted"></span></header>
<main>
  <h2>Order a mix</h2>
  <div id="presets" class="grid"></div>

  <details>
    <summary>&#9881; Settings</summary>
    <h2>Liquids</h2>
    <p class="muted">Name and color of the liquid in each pump.</p>
    <div id="liquids"></div>
    <h2>Presets</h2>
    <p class="muted">Percentages must add up to 100, volume 100&ndash;199&nbsp;ml. Clear the name and save to delete.</p>
    <div id="editor"></div>
  </details>
</main>
<div id="msg"></div>

<script>
const $ = s => document.querySelector(s);
let cfg = null, msgTimer;

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k in e ? e[k] = v : e.setAttribute(k, v);
  e.append(...kids);
  return e;
}

function toast(text, err) {
  const m = $('#msg');
  m.textContent = text;
  m.className = 'show' + (err ? ' err' : '');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => m.className = '', 3000);
}

//one request at a time: every button is disabled until the machine answers (no double orders on a slow phone)
async function call(url) {
  const btns = document.querySelectorAll('button');
  for (const b of btns) b.disabled = true;
  try {
    const r = await fetch(url);
    toast(await r.text(), !r.ok);
    if (r.ok) await load();
  } catch (e) { toast('No answer from the machine', true); }
  for (const b of btns) b.disabled = false;
}

//approximate color of a mix: weighted geometric mean of each channel (paint-like)
function mixColor(v) {
  let acc = [0, 0, 0], tot = 0;
  v.forEach((p, i) => {
    if (!p) return;
    const c = parseInt(cfg.l[i].c.slice(1), 16);
    [c >> 16, (c >> 8) & 255, c & 255].forEach((ch, k) => acc[k] += p * Math.log(Math.max(ch, 13)));
    tot += p;
  });
  return tot ? 'rgb(' + acc.map(a => Math.round(Math.exp(a / tot))).join(',') + ')' : 'transparent';
}

function renderOrder() {
  $('#queue').textContent = `Queue ${cfg.q[0]}/${cfg.q[1]}`;
  const box = $('#presets');
  box.textContent = ''; //not replaceChildren(): missing in older Android browsers
  cfg.p.forEach((p, i) => {
    if (!p.n) return;
    const parts = p.v.map((v, k) => v ? `${cfg.l[k].n} ${v}%` : '').filter(Boolean).join(' · ');
    box.append(el('button', { className: 'preset', onclick: () => call('/order?p=' + i) },
      el('span', { className: 'sw', style: 'background:' + mixColor(p.v) }),
      el('b', { textContent: p.n }),
      el('small', { textContent: p.ml + ' ml' }),
      el('span', { className: 'parts', textContent: parts })));
  });
  if (!box.children.length) box.append(el('p', { className: 'muted', textContent: 'No presets yet: create one in Settings.' }));
}

function renderSettings() {
  const liq = $('#liquids');
  liq.textContent = '';
  cfg.l.forEach((l, i) => {
    const name = el('input', { type: 'text', value: l.n, maxLength: 15 });
    const color = el('input', { type: 'color', value: l.c });
    liq.append(el('div', { className: 'card liq' },
      el('b', { textContent: 'Pump ' + (i + 1) }), name, color,
      el('button', { className: 'act', textContent: 'Save', onclick: () =>
        call(`/liquid?i=${i}&n=${encodeURIComponent(name.value)}&c=${color.value.slice(1)}`) })));
  });

  const ed = $('#editor');
  ed.textContent = '';
  cfg.p.forEach((p, i) => {
    const name = el('input', { type: 'text', value: p.n, maxLength: 15, placeholder: 'Empty slot ' + (i + 1) });
    const pct = p.v.map((v, k) => el('input', { type: 'number', value: v, min: 0, max: 100 }));
    const ml = el('input', { type: 'number', value: p.ml || 100, min: 100, max: 199 });
    const sum = el('span', { className: 'sum' });
    const upd = () => {
      const s = pct.reduce((a, x) => a + (+x.value || 0), 0);
      sum.textContent = 'Total ' + s + '%';
      sum.className = 'sum' + (s === 100 ? '' : ' bad');
    };
    pct.forEach(x => x.oninput = upd);
    upd();
    const lab = (text, input) => el('label', {}, el('span', { textContent: text }), input);
    const pcts = el('div', { className: 'pcts' });
    pct.forEach((x, k) => pcts.append(lab(cfg.l[k].n + ' %', x)));
    const foot = el('div', { className: 'foot' }, sum,
      el('button', { className: 'act', textContent: 'Save', onclick: () =>
        call(`/preset?i=${i}&n=${encodeURIComponent(name.value)}&ml=${ml.value}&v=${pct.map(x => +x.value || 0).join(',')}`) }));
    if (p.n) foot.append(el('button', { className: 'act del', textContent: 'Delete', onclick: () =>
      call(`/preset?i=${i}&n=&ml=100&v=${p.v.map(() => 0).join(',')}`) }));
    const row = el('div', { className: 'card' },
      el('div', { className: 'top' }, lab('Name', name), lab('Volume ml', ml)), pcts, foot);
    ed.append(row);
  });
}

async function load() {
  try { cfg = await (await fetch('/cfg')).json(); }
  catch (e) { toast('No answer from the machine', true); return; }
  try { renderOrder(); renderSettings(); }
  catch (e) { toast('Page error: ' + e.message, true); } //e.g. an old browser missing a JS feature
}
load();
</script>
</body>
</html>
